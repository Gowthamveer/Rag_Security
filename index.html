const b64=b=>{let s='',a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),rnd=n=>b64(crypto.getRandomValues(new Uint8Array(n)));

const API_BASE = window.location.origin;

async function apiRequest(path, {
  method = "GET",
  body = null,
  formData = null,
  auth = true
} = {}) {
  const headers = {};

  if (auth) {
    const token = sessionStorage.getItem("rsg_api_token");
    if (token) headers.Authorization = `Bearer ${token}`;
  }

  let payload;
  if (formData) {
    payload = formData;
  } else if (body !== null) {
    headers["Content-Type"] = "application/json";
    payload = JSON.stringify(body);
  }

  const response = await fetch(`${API_BASE}${path}`, {
    method,
    headers,
    body: payload
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.detail || `API error: ${response.status}`);
  }

  return data;
}

async function apiRegister(email, password) {
  return apiRequest("/auth/register", {
    method: "POST",
    auth: false,
    body: { email, password }
  });
}

async function apiLogin(email, password, otp = "") {
  const result = await apiRequest("/auth/login", {
    method: "POST",
    auth: false,
    body: {
      email,
      password,
      ...(otp ? { otp } : {})
    }
  });

  if (!result.token) {
    throw new Error("Login succeeded but no authentication token was returned.");
  }

  sessionStorage.setItem("rsg_api_token", result.token);
  sessionStorage.setItem("rsg_api_role", result.role || "");

  return result;
}

function apiLogout() {
  sessionStorage.removeItem("rsg_api_token");
  sessionStorage.removeItem("rsg_api_role");
}

    const result=await apiRequest('/gateway',{method:'POST',body:{question,response_override:override||null}});

    await log('trace',`${result.trace_id} backend decision: ${result.decision}`,level,{trace:{id:result.trace_id,decision:result.decision,answer:result.answer}});
    $('#gr').innerHTML=`<div class="card"><h3>${esc(result.trace_id)} ${bd(result.decision==='Allow'?'Pass':result.decision)}</h3><p>${esc(result.answer)}</p>${result.data_access?`<div class="step"><b>Secure data layer</b> <small>role: ${esc(result.data_access.role)} · ${result.data_access.rows} row(s)</small><br><small>Released: ${result.data_access.fields_released.map(esc).join(', ')}</small>${result.data_access.fields_denied.length?`<br><small>Withheld by policy: ${result.data_access.fields_denied.map(esc).join(', ')}</small> ${bd('Block')}`:''}</div>`:''}<small>Processed by the FastAPI gateway. The trace is available to authorized users via the backend API.</small></div>`;
  }catch(error){$('#gr').innerHTML=`<div class="card"><h3>Backend request failed</h3><p class="er">${esc(error.message)}</p><small>Check the API connection and, unless a test response was supplied, the configured model provider.</small></div>`}
};
const localSignOut=signOut;
window.signOut=async()=>{apiLogout();await localSignOut()};
const localAccountView=V.acct;
V.acct=()=>localAccountView().replace('<option>admin</option>','');
window.addUser=async function(){
  if(S.role!=='admin')return;
  const email=$('#ne').value.trim().toLowerCase(),password=$('#nq').value,role=$('#nr').value;
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('Enter a valid email');
  if(!okpw(password))return toast('Password needs at least 8 characters, including letters and numbers');
  try{
    await apiRequest('/admin/users',{method:'POST',body:{email,password,role}});
    await ensureLocalWorkspace(email,password,role);
    toast('Backend user created');go('acct');
  }catch(error){toast('Could not create backend user: '+error.message)}
};
window.chpw=async function(){
  const currentPassword=$('#op').value,newPassword=$('#np').value,users=ls.g('rsg_users')||{},user=users[S.u];
  if(!user||await pb(currentPassword,user.salt)!==user.h)return toast('Current password is wrong');
  if(!okpw(newPassword))return toast('New password needs at least 8 characters, including letters and numbers');
  try{
    await apiRequest('/auth/password',{method:'POST',body:{current_password:currentPassword,new_password:newPassword}});
    user.salt=rnd(16);user.h=await pb(newPassword,user.salt);user.vs=rnd(16);
    const key=await vk(newPassword,user.vs);
    if(!ls.s('rsg_users',users))throw new Error('Backend password changed, but local account storage failed. Sign in again with the new password.');
    S.key=key;await log('auth','Password changed on backend and local workspace');
    toast('Password changed');go('acct');
  }catch(error){toast('Password change failed: '+error.message)}
};
if(!crypto?.subtle)document.body.textContent='This browser does not support the Web Crypto API needed for the encrypted vault.';else showAuth();
</script></body></html>
